<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #gameCanvas {
    background: linear-gradient(#70c5ce, #b3e5ea);
    border: 4px solid #2c3e50;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  #uiOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 400px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #uiOverlay h1, #uiOverlay p {
    pointer-events: none;
  }
  .game-btn {
    pointer-events: auto;
    background: #ffca28;
    color: #4e342e;
    border: 3px solid #f57f17;
    border-radius: 10px;
    padding: 10px 28px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 0 #e65100, 0 6px 10px rgba(0,0,0,0.3);
    text-shadow: none;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
  }
  .game-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #e65100, 0 2px 6px rgba(0,0,0,0.3);
  }
  .dev-btn {
    pointer-events: auto;
    margin-top: 18px;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    text-shadow: none;
  }
  .dev-btn:active {
    background: rgba(255,255,255,0.3);
  }
  .code-input {
    pointer-events: auto;
    margin-top: 14px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 13px;
    font-family: inherit;
    width: 100px;
    text-align: center;
  }
  .code-input::placeholder {
    color: rgba(255,255,255,0.7);
  }
  #flyToggleContainer {
    position: absolute;
    top: 50px;
    right: 6px;
    z-index: 10;
  }
  .fly-btn {
    pointer-events: auto;
    background: #ec407a;
    color: white;
    border: 2px solid #ad1457;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 3px 0 #880e4f;
  }
  .fly-btn.off {
    background: #78909c;
    border-color: #455a64;
    box-shadow: 0 3px 0 #37474f;
  }
  .fly-btn:active {
    transform: translateY(3px);
    box-shadow: none;
  }
</style>
</head>
<body>
<div style="position: relative;">
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="uiOverlay"></div>
  <div id="flyToggleContainer" style="display:none;">
    <button class="fly-btn off" id="flyToggleBtn">Bay tự do: TẮT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('uiOverlay');

const W = canvas.width;
const H = canvas.height;

let bird, pipes, score, best, gravity, gameState, frame;
let flyUnlocked = localStorage.getItem('flappyFlyUnlocked') === '1';
let flyMode = false;
const flyToggleContainer = document.getElementById('flyToggleContainer');
const flyToggleBtn = document.getElementById('flyToggleBtn');

function updateFlyToggleVisibility() {
  flyToggleContainer.style.display = flyUnlocked ? 'block' : 'none';
}

function setFlyMode(on) {
  flyMode = on;
  flyToggleBtn.textContent = 'Bay tự do: ' + (flyMode ? 'BẬT' : 'TẮT');
  flyToggleBtn.classList.toggle('off', !flyMode);
}

flyToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  setFlyMode(!flyMode);
});

updateFlyToggleVisibility();

function resetGame() {
  bird = { x: 80, y: H / 2, vy: 0, r: 14, rotation: 0 };
  pipes = [];
  score = 0;
  gravity = 0.32;
  frame = 0;
  gameState = 'ready'; // ready, playing, dead
  updateOverlay();
}

best = Number(localStorage.getItem('flappyBest')) || 0;

function updateOverlay() {
  if (gameState === 'ready') {
    const devSection = flyUnlocked
      ? `<p style="margin:14px 0 0;font-size:12px;color:#ff4fa3;font-weight:bold;">🔓 Đã mở khóa: Bay tự do</p>`
      : `<div style="margin-top:14px;display:flex;gap:6px;align-items:center;">
           <input type="text" class="code-input" id="codeInput" placeholder="Nhập code">
           <button class="dev-btn" id="codeBtn" style="margin-top:0;">Nhập</button>
         </div>
         <p id="codeMsg" style="margin:6px 0 0;font-size:12px;min-height:14px;"></p>`;

    overlay.innerHTML = `<h1 style="margin:0 0 12px;font-size:32px;">Flappy Bird</h1>
      <button class="game-btn" id="startBtn">Bắt đầu</button>
      <p style="margin:10px 0 0;font-size:13px;opacity:0.85;">(hoặc nhấn SPACE)</p>
      <button class="dev-btn" id="devBtn">Nhà phát triển</button>
      <p id="devName" style="margin:6px 0 0;font-size:13px;min-height:16px;color:#ff4fa3;font-weight:bold;"></p>
      ${devSection}`;
    document.getElementById('startBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      flap();
    });
    document.getElementById('devBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('devName').textContent = 'gh23 (kei)';
    });
    if (!flyUnlocked) {
      const codeInput = document.getElementById('codeInput');
      const codeBtn = document.getElementById('codeBtn');
      const codeMsg = document.getElementById('codeMsg');
      const tryCode = () => {
        if (codeInput.value.trim().toLowerCase() === 'gh23') {
          flyUnlocked = true;
          localStorage.setItem('flappyFlyUnlocked', '1');
          updateFlyToggleVisibility();
          updateOverlay();
        } else {
          codeMsg.style.color = '#ff5252';
          codeMsg.textContent = 'Sai code!';
        }
      };
      codeBtn.addEventListener('click', (e) => { e.stopPropagation(); tryCode(); });
      codeInput.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') tryCode();
      });
      codeInput.addEventListener('click', (e) => e.stopPropagation());
    }
  } else if (gameState === 'dead') {
    overlay.innerHTML = `<h1 style="margin:0 0 8px;font-size:28px;">Game Over</h1>
      <p style="margin:0 0 12px;">Điểm: ${score} | Cao nhất: ${best}</p>
      <button class="game-btn" id="restartBtn">Chơi lại</button>`;
    document.getElementById('restartBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      flap();
    });
  } else {
    overlay.innerHTML = '';
  }
}

const PIPE_GAP = 150;
const PIPE_WIDTH = 60;
const PIPE_SPEED = 2.6;
const PIPE_INTERVAL = 90;

function spawnPipe() {
  const margin = 60;
  const topHeight = margin + Math.random() * (H - PIPE_GAP - margin * 2 - 100);
  pipes.push({ x: W, top: topHeight, passed: false });
}

function flap() {
  if (gameState === 'ready') {
    gameState = 'playing';
    updateOverlay();
    bird.vy = -6.8;
  } else if (gameState === 'playing') {
    bird.vy = -6.8;
  } else if (gameState === 'dead') {
    resetGame();
  }
}

function dive() {
  if (gameState === 'playing') {
    bird.vy = 6.8;
  }
}

function update() {
  if (gameState !== 'playing') return;

  frame++;
  if (flyMode) {
    bird.vy *= 0.85;
  } else {
    bird.vy += gravity;
  }
  bird.y += bird.vy;
  bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy * 0.06));

  if (frame % PIPE_INTERVAL === 0) spawnPipe();

  for (const p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
    }
  }
  pipes = pipes.filter(p => p.x > -PIPE_WIDTH);

  // Collisions
  if (bird.y + bird.r > H - 20 || bird.y - bird.r < 0) {
    die();
  }
  for (const p of pipes) {
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
    const hitTop = bird.y - bird.r < p.top;
    const hitBottom = bird.y + bird.r > p.top + PIPE_GAP;
    if (inX && (hitTop || hitBottom)) {
      die();
    }
  }
}

function die() {
  if (gameState !== 'playing') return;
  gameState = 'dead';
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', best);
  }
  updateOverlay();
}

function drawBackground() {
  ctx.fillStyle = '#70c5ce';
  ctx.fillRect(0, 0, W, H);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    const cx = ((frame * 0.3 + i * 150) % (W + 100)) - 50;
    ctx.beginPath();
    ctx.arc(cx, 80 + i * 60, 20, 0, Math.PI * 2);
    ctx.arc(cx + 20, 75 + i * 60, 25, 0, Math.PI * 2);
    ctx.arc(cx + 45, 80 + i * 60, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // ground
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.fillStyle = '#c9c17a';
  ctx.fillRect(0, H - 20, W, 4);
}

function drawPipes() {
  for (const p of pipes) {
    ctx.fillStyle = '#4caf50';
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 3;
    // top pipe
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillRect(p.x - 5, p.top - 20, PIPE_WIDTH + 10, 20);
    ctx.strokeRect(p.x - 5, p.top - 20, PIPE_WIDTH + 10, 20);
    // bottom pipe
    const bottomY = p.top + PIPE_GAP;
    ctx.fillRect(p.x, bottomY, PIPE_WIDTH, H - bottomY - 20);
    ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, H - bottomY - 20);
    ctx.fillRect(p.x - 5, bottomY, PIPE_WIDTH + 10, 20);
    ctx.strokeRect(p.x - 5, bottomY, PIPE_WIDTH + 10, 20);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  // body
  ctx.fillStyle = '#ffd54f';
  ctx.strokeStyle = '#f57f17';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.r, bird.r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // wing
  ctx.fillStyle = '#fbc02d';
  ctx.beginPath();
  ctx.ellipse(-2, 4, 7, 5, Math.PI / 6, 0, Math.PI * 2);
  ctx.fill();

  // eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(6, -4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(7.5, -4, 2, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#ff7043';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, -2);
  ctx.lineTo(bird.r + 8, 1);
  ctx.lineTo(bird.r - 2, 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawScore() {
  if (gameState === 'playing') {
    ctx.fillStyle = 'white';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W / 2, 60);
    ctx.fillText(score, W / 2, 60);
  }
}

function loop() {
  update();
  drawBackground();
  drawPipes();
  drawBird();
  drawScore();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    e.preventDefault();
    flap();
  }
  if (e.key === 'Shift') {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    dive();
  }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

resetGame();
loop();
</script>
</body>
</html>
